<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Shadow Princess - Interactive Book</title>

    css/style.css?v=5

    <style>
        /*
            Emergency inline safety styles.
            These make sure the loading screen can be removed
            even if the external CSS is cached or delayed.
        */

        #loading-screen.force-hide {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- Background Video -->
    <div id="background-container">
        <video id="background-video" autoplay muted loop playsinline>
            assets/background.webm
            Your browser does not support the background video.
        </video>
    </div>


    <!-- Main Application -->
    <main id="book-reader">

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loading-text">
                Opening The Shadow Princess...
            </div>
        </div>


        <!-- Book Container -->
        <section id="book-container" aria-label="The Shadow Princess interactive book">

            <!-- Closed Book Cover -->
            <div id="front-cover" class="book-cover" aria-label="Front cover. Drag left to open the book.">
                assets/front-cover.png
            </div>


            <!-- Open Book -->
            <div id="open-book" aria-label="Open book">

                <!-- Left Page -->
                <div id="left-page" class="page" aria-label="Left page">
                    
                </div>


                <!-- Right Page -->
                <div id="right-page" class="page" aria-label="Right page">
                    
                </div>


                <!-- Turning Page Layer -->
                <div id="page-turn-layer" aria-hidden="true">
                    
                </div>

            </div>

        </section>


        <!-- Floating Table of Contents Button -->
        <button
            id="toc-button"
            type="button"
            aria-label="Return to Table of Contents"
            title="Return to Table of Contents"
        >
            ☰
        </button>


        <!-- Resume Reading Window -->
        <div id="resume-window" aria-hidden="true">
            <div id="resume-box">
                <h2>Welcome Back</h2>

                <p>
                    Continue reading from where you last left off?
                </p>

                <div class="resume-buttons">
                    <button id="resume-yes" type="button">
                        Resume Reading
                    </button>

                    <button id="resume-no" type="button">
                        Start From Beginning
                    </button>
                </div>
            </div>
        </div>

    </main>


    <!-- Emergency fallback:
         If main.js fails or GitHub Pages serves an old cached JS file,
         this removes the loading screen so the page is not trapped forever.
    -->
    <script>
        window.addEventListener("load", function () {
            console.log("Index.html loaded. Emergency fallback armed.");

            setTimeout(function () {
                var loadingScreen = document.getElementById("loading-screen");

                if (loadingScreen) {
                    console.warn("Emergency fallback removing loading screen.");

                    loadingScreen.classList.add("hidden");
                    loadingScreen.classList.add("force-hide");

                    loadingScreen.style.opacity = "0";
                    loadingScreen.style.visibility = "hidden";
                    loadingScreen.style.pointerEvents = "none";
                    loadingScreen.style.display = "none";
                }
            }, 3000);
        });
    </script>


    <!-- Main Reader Script -->
    js/main.js?v=5script>

</body>
</html>
