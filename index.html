<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Shadow Princess</title>

    css/style.css
    js/main.jsscript>
</head>

<body>

    <!-- =====================================================
         BACKGROUND VIDEO
         This fades in after the book is selected/opened.
         ===================================================== -->
    <div id="background-video-layer" aria-hidden="true">
        <video id="background-video" autoplay muted loop playsinline preload="auto">
            assets/background.webm
        </video>
    </div>


    <!-- =====================================================
         APP WRAPPER
         ===================================================== -->
    <main id="shadow-princess-app">


        <!-- =================================================
             LOADING SCREEN
             ================================================= -->
        <section id="loading-screen" aria-label="Loading The Shadow Princess">
            <div id="loading-card">
                <div class="loading-title">The Shadow Princess</div>
                <div class="loading-subtitle">Opening the book...</div>
            </div>
        </section>


        <!-- =================================================
             BOOK SELECTION / SHELF SCENE
             Uses your shelf image and spine image.
             ================================================= -->
        <section id="library-scene" aria-label="Book selection scene">

            <div id="shelf-stage">

                assets/Empty-Book-Shelf.png

                <button
                    id="spine-button"
                    type="button"
                    aria-label="Select The Shadow Princess"
                >
                    assets/spine.png
                </button>

            </div>

        </section>


        <!-- =================================================
             READER SCENE
             This is the actual interactive book.
             ================================================= -->
        <section id="reader-scene" aria-label="The Shadow Princess reader">

            <div id="book-stage">

                <!-- Closed front cover -->
                <div
                    id="front-cover"
                    aria-label="Front cover. Drag left to open the book."
                >
                    assets/front-cover.png
                </div>


                <!-- Open book spread -->
                <div id="open-book" aria-label="Open book">

                    <!-- LEFT SIDE OF THE PHYSICAL BOOK
                         This is a display container only.
                         Your files are still numbered pages.
                         Even-numbered story pages will appear here.
                         The TOC also appears here at the beginning. -->
                    <div id="book-left-page" class="book-page" aria-label="Left side of open book">
                        
                    </div>


                    <!-- RIGHT SIDE OF THE PHYSICAL BOOK
                         This is a display container only.
                         Your files are still numbered pages.
                         Odd-numbered story pages will appear here. -->
                    <div id="book-right-page" class="book-page" aria-label="Right side of open book">
                        
                    </div>


                    <!-- Temporary animated page used while dragging/turning -->
                    <div id="turning-page" aria-hidden="true">
                        
                    </div>

                </div>

            </div>


            <!-- Floating Table of Contents button -->
            <button
                id="toc-button"
                type="button"
                aria-label="Return to Table of Contents"
                title="Return to Table of Contents"
            >
                ☰
            </button>


            <!-- Small helper text -->
            <div id="reader-help" aria-hidden="true">
                Drag the cover or page corner to turn. Use ← and → keys to navigate.
            </div>

        </section>


        <!-- =================================================
             RESUME NOTICE
             main.js will control whether this appears.
             ================================================= -->
        <section id="resume-panel" aria-label="Resume reading" aria-hidden="true">
            <div id="resume-box">
                <h2>Welcome Back</h2>

                <p id="resume-message">
                    Your place has been saved.
                </p>

                <div id="resume-actions">
                    <button id="resume-button" type="button">
                        Resume Reading
                    </button>

                    <button id="restart-button" type="button">
                        Start From Beginning
                    </button>
                </div>
            </div>
        </section>


        <!-- =================================================
             NO SCRIPT FALLBACK
             ================================================= -->
        <noscript>
            <div id="noscript-message">
                This interactive book requires JavaScript to turn pages.
            </div>
        </noscript>

    </main>

</body>
</html>
