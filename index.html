<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Shadow Princess - Interactive Flipbook</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- =====================================================
     LOOPING MAGICAL BACKGROUND
====================================================== -->

<div id="background-container">

    <video 
        id="background-video"
        autoplay
        muted
        loop
        playsinline>

        <source src="assets/background.webm" type="video/webm">

    </video>

</div>




<!-- =====================================================
     PHYSICAL BOOK
====================================================== -->

<main id="book-stage">



    <div id="book">



        <!-- =============================================
             CLOSED FRONT COVER
             User drags this open
        ============================================== -->

        <div id="front-cover"
             class="cover">


            <img
                src="assets/front-cover.png"
                alt="The Shadow Princess Front Cover">


        </div>






        <!-- =============================================
             OPEN BOOK
             Always exists underneath cover
        ============================================== -->


        <div id="open-book">





            <!-- =========================================
                 LEFT SIDE OF BOOK
            ========================================== -->


            <div id="left-stack"
                 class="page-stack">


                <div class="page"
                     id="left-page">


                    <img
                        id="left-page-image"
                        src="assets/Table-of-Contents1.png"
                        alt="Table of Contents">


                </div>


            </div>







            <!-- =========================================
                 CENTER SPINE
            ========================================== -->


            <div id="book-spine"></div>







            <!-- =========================================
                 RIGHT SIDE OF BOOK
            ========================================== -->


            <div id="right-stack"
                 class="page-stack">


                <div class="page"
                     id="right-page">


                    <img
                        id="right-page-image"
                        src="chapters/one/Chapter-One-Page-1.png"
                        alt="Chapter One Page One">


                </div>


            </div>








            <!-- =========================================
                 ACTIVE TURNING PAGE

                 JavaScript moves this layer during
                 drag interactions
            ========================================== -->


            <div id="turning-page">


                <div id="turning-page-inner">


                    <img
                        id="turning-page-image"
                        src=""
                        alt="">


                </div>


            </div>






        </div>





    </div>





    <!-- =============================================
         OPTIONAL CONTROLS
         Keyboard and accessibility support
    ============================================== -->


    <button
        id="toc-button"
        aria-label="Return to Table of Contents">

        ☰

    </button>




</main>





<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="js/main.js"></script>


</body>

</html>
