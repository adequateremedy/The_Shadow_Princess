<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Shadow Princess - Interactive Book</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
         LOOPING BACKGROUND VIDEO
    ====================================================== -->

    <div id="background-container">

        <video 
            id="background-video"
            autoplay
            muted
            loop
            playsinline>

            <source src="assets/background.webm" type="video/webm">

        </video>

    </div>



    <!-- =====================================================
         MAIN READER APPLICATION
    ====================================================== -->

    <main id="book-reader">



        <!-- Loading Overlay -->

        <div id="loading-screen">

            <div class="loading-text">
                Opening The Shadow Princess...
            </div>

        </div>




        <!-- =================================================
             BOOK AREA
        ================================================== -->

        <section id="book-container">



            <!-- =============================================
                 CLOSED FRONT COVER
            ============================================== -->

            <div 
                id="front-cover"
                class="book-cover">


                <img 
                    src="assets/front-cover.png"
                    alt="The Shadow Princess Front Cover">


            </div>






            <!-- =============================================
                 OPEN BOOK
            ============================================== -->


            <div id="open-book">





                <!-- LEFT PAGE
                     Even numbered pages
                     TOC begins here
                -->


                <div 
                    id="left-page"
                    class="page">


                    <img
                        id="left-page-image"
                        src=""
                        alt="Left Book Page">


                </div>







                <!-- RIGHT PAGE
                     Odd numbered pages
                     Chapter 1 Page 1 begins here
                -->


                <div 
                    id="right-page"
                    class="page">


                    <img
                        id="right-page-image"
                        src=""
                        alt="Right Book Page">


                </div>







                <!-- =========================================
                     ACTIVE TURNING PAGE
                     Used by JavaScript for drag physics
                ========================================== -->


                <div id="page-turn-layer">


                    <img
                        id="turning-page-image"
                        src=""
                        alt="">


                </div>





            </div>



        </section>








        <!-- =================================================
             FLOATING TABLE OF CONTENTS BUTTON
        ================================================== -->


        <button
            id="toc-button"
            aria-label="Return to Table of Contents">


            ☰


        </button>








        <!-- =================================================
             RESUME READING WINDOW
             Appears if saved progress exists
        ================================================== -->


        <div id="resume-window">



            <div id="resume-box">



                <h2>
                    Welcome Back
                </h2>




                <p>
                    Continue reading from where you last left off?
                </p>




                <div class="resume-buttons">



                    <button id="resume-yes">

                        Resume Reading

                    </button>




                    <button id="resume-no">

                        Start From Beginning

                    </button>



                </div>



            </div>



        </div>






    </main>






    <!-- JavaScript -->

    <script src="js/main.js"></script>



</body>

</html>
