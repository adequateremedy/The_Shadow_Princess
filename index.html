<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Shadow Princess - Interactive Flipbook</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ======================================================
     BACKGROUND VIDEO
====================================================== -->

<div id="background-container">

    <video
        id="background-video"
        muted
        loop
        playsinline>

        <source src="assets/background.webm" type="video/webm">

    </video>

</div>




<!-- ======================================================
     BOOK STAGE
====================================================== -->

<div id="book-stage">



    <!-- ==================================================
         CLOSED BOOK COVER
    =================================================== -->

    <div id="book-cover">

        <img
            id="front-cover-image"
            src="assets/front-cover.png"
            alt="The Shadow Princess Front Cover">

    </div>





    <!-- ==================================================
         OPEN BOOK
    =================================================== -->

    <div id="book">



        <!-- Inside Cover Surface -->

        <div id="inside-cover">



            <!-- LEFT INSIDE COVER -->

            <div id="inside-left-cover"></div>



            <!-- RIGHT INSIDE COVER -->

            <div id="inside-right-cover"></div>



        </div>







        <!-- =================================================
             LEFT PAGE STACK
        ================================================== -->

        <div id="left-page-stack">


            <div class="page-layer"></div>


        </div>








        <!-- =================================================
             RIGHT PAGE STACK
        ================================================== -->

        <div id="right-page-stack">


            <div class="page-layer"></div>


        </div>








        <!-- =================================================
             CURRENT OPEN SPREAD
        ================================================== -->



        <div id="left-page">

            <img
                id="left-page-image"
                src="assets/Table-of-Contents1.png"
                alt="Table of Contents">

        </div>





        <div id="right-page">


            <img
                id="right-page-image"
                src="chapters/one/Chapter-One-Page-1.png"
                alt="Chapter One Page One">


        </div>









        <!-- =================================================
             TURNING PAGE
             Controlled by JavaScript
        ================================================== -->

        <div id="turning-page">


            <img
                id="turning-page-image"
                src=""
                alt="">


        </div>






        <!-- CENTER FOLD -->

        <div id="center-fold"></div>



    </div>





</div>







<!-- ======================================================
     CONTROLS
====================================================== -->


<button
    id="toc-button"
    aria-label="Return to Table of Contents">

    ☰

</button>




<script src="js/main.js"></script>


</body>

</html>
