<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Shadow Princess - Interactive Book</title>

    css/style.css?v=10
</head>

<body>

    <!-- Background Video -->
    <div id="background-container">
        <video id="background-video" autoplay muted loop playsinline>
            assets/background.webm
            Your browser does not support the video tag.
        </video>
    </div>


    <!-- Main Reader -->
    <main id="book-reader">

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loading-text">
                Opening The Shadow Princess...
            </div>
        </div>


        <!-- Book Container -->
        <section id="book-container" aria-label="The Shadow Princess interactive book">

            <!-- Front Cover -->
            <div
                id="front-cover"
                class="book-cover"
                aria-label="Front cover. Drag left to open the book."
            >
                assets/front-cover.png
            </div>


            <!-- Open Book -->
            <div id="open-book" aria-label="Open book">

                <!-- Left Page -->
                <div id="left-page" class="page" aria-label="Left page">
                    
                </div>


                <!-- Right Page -->
                <div id="right-page" class="page" aria-label="Right page">
                    
                </div>


                <!-- Turning Page Layer -->
                <div id="page-turn-layer" aria-hidden="true">
                    
                </div>

            </div>

        </section>


        <!-- Floating Table of Contents Button -->
        <button
            id="toc-button"
            type="button"
            aria-label="Return to Table of Contents"
            title="Return to Table of Contents"
        >
            ☰
        </button>


        <!-- Resume Reading Window -->
        <div id="resume-window" aria-hidden="true">
            <div id="resume-box">
                <h2>Welcome Back</h2>

                <p>
                    Continue reading from where you last left off?
                </p>

                <div class="resume-buttons">
                    <button id="resume-yes" type="button">
                        Resume Reading
                    </button>

                    <button id="resume-no" type="button">
                        Start From Beginning
                    </button>
                </div>
            </div>
        </div>

    </main>


    <!-- Safety fallback so loading screen cannot trap the site forever -->
    <script>
        window.addEventListener("load", function () {
            setTimeout(function () {
                const loadingScreen = document.getElementById("loading-screen");

                if (loadingScreen) {
                    loadingScreen.classList.add("hidden");
                    loadingScreen.style.opacity = "0";
                    loadingScreen.style.visibility = "hidden";
                    loadingScreen.style.pointerEvents = "none";

                    setTimeout(function () {
                        loadingScreen.style.display = "none";
                    }, 500);
                }
            }, 3000);
        });
    </script>


    <!-- Main Reader Script -->
    js/main.js?v=10script>

</body>
</html>
