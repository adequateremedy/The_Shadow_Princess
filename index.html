<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Shadow Princess</title>

    css/style.css
    js/main.jsscript>
</head>

<body>

    <!-- Background WebM Video -->
    <div id="background-video-layer">
        <video id="background-video" autoplay muted loop playsinline preload="auto">
            assets/background.webm
        </video>
    </div>


    <!-- Main App -->
    <main id="shadow-princess-app">


        <!-- Loading Screen -->
        <section id="loading-screen">
            <div id="loading-card">
                <h1>The Shadow Princess</h1>
                <p>Opening the book...</p>
            </div>
        </section>


        <!-- Book Reader Scene -->
        <section id="reader-scene">

            <div id="book-stage">


                <!-- Closed Front Cover -->
                <div id="front-cover" aria-label="Front cover. Drag left to open the book.">
                    assets/front-cover.png
                </div>


                <!-- Open Book -->
                <div id="open-book" aria-label="Open book">


                    <!-- Left side of the physical book.
                         TOC appears here first.
                         After that, even-numbered pages appear here. -->
                    <div id="book-left-page" class="book-page">
                        
                    </div>


                    <!-- Right side of the physical book.
                         Odd-numbered pages appear here. -->
                    <div id="book-right-page" class="book-page">
                        
                    </div>


                    <!-- Temporary animated page used during page turns -->
                    <div id="turning-page">
                        
                    </div>


                </div>

            </div>


            <!-- Floating Table of Contents Button -->
            <button
                id="toc-button"
                type="button"
                aria-label="Return to Table of Contents"
                title="Return to Table of Contents"
            >
                ☰
            </button>


            <!-- Reader Help Text -->
            <div id="reader-help">
                Drag the cover or page corner to turn. Use ← and → keys to navigate.
            </div>

        </section>


        <!-- Resume Reading Panel -->
        <section id="resume-panel" aria-hidden="true">
            <div id="resume-box">
                <h2>Welcome Back</h2>

                <p id="resume-message">
                    Your place has been saved.
                </p>

                <div id="resume-actions">
                    <button id="resume-button" type="button">
                        Resume Reading
                    </button>

                    <button id="restart-button" type="button">
                        Start From Beginning
                    </button>
                </div>
            </div>
        </section>


        <!-- No JavaScript Message -->
        <noscript>
            <div id="noscript-message">
                This interactive book requires JavaScript to turn pages.
            </div>
        </noscript>

    </main>

</body>
</html>
