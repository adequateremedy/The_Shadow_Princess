<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Shadow Princess</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ======================================================
         BACKGROUND VIDEO
         Loads paused.
         JavaScript starts playback when the cover opens.
    ======================================================= -->

    <video
        id="background-video"
        muted
        loop
        playsinline>

        <source src="assets/background.webm" type="video/webm">

    </video>





    <!-- ======================================================
         BOOK CONTAINER
         Represents the physical book.
    ======================================================= -->

    <main id="book">


        <!-- ==================================================
             CLOSED FRONT COVER
        =================================================== -->

        <div id="front-cover">


            <img
                src="assets/front-cover.png"
                alt="The Shadow Princess Front Cover">


        </div>





        <!-- ==================================================
             OPEN BOOK
             The cover remains underneath.
        =================================================== -->

        <div id="open-book">



            <!-- ==============================================
                 INSIDE COVER / REVERSED FRONT COVER

                 This remains visible underneath all pages.
            =============================================== -->

            <div id="inside-cover">


                <img
                    src="assets/front-cover.png"
                    alt="Inside Cover">


            </div>





            <!-- ==============================================
                 PAGE SPREAD

                 Centered around the book fold.
            =============================================== -->

            <div id="page-spread">



                <!-- LEFT PAGE -->

                <div
                    id="left-page"
                    class="page">


                    <img
                        id="left-page-image"
                        src="assets/Table-of-Contents1.png"
                        alt="Table of Contents">


                </div>





                <!-- RIGHT PAGE -->

                <div
                    id="right-page"
                    class="page">


                    <img
                        id="right-page-image"
                        src="chapters/one/Chapter-One-Page-1.png"
                        alt="Chapter One Page One">


                </div>



            </div>






            <!-- ==============================================
                 ACTIVE TURNING PAGE

                 Used for realistic drag turning.
            =============================================== -->

            <div id="turning-page">


                <img
                    id="turning-page-image"
                    src=""
                    alt="">


            </div>





        </div>







        <!-- ==================================================
             BOOK CENTER FOLD
             Single axis for cover and pages.
        =================================================== -->

        <div id="book-fold"></div>






        <!-- ==================================================
             RETURN TO TABLE OF CONTENTS BUTTON

             Hidden until JavaScript activates it.
        =================================================== -->

        <button
            id="toc-button"
            aria-label="Return to Table of Contents">

            ☰

        </button>





    </main>






    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script src="js/main.js"></script>



</body>

</html>
